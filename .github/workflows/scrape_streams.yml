name: Hourly stream links prefetch

on:
  schedule:
    # Deux fois par heure (6 septembre 2026) : les sites publient leurs liens dans l'heure
    # qui précède le coup d'envoi, et un cache horaire les manquait pour la moitié des
    # matchs. Un passage dure ~13 min ; décalé de :00 pour éviter la congestion des runners.
    #
    # Cadence RÉELLE, relevée le 9 septembre 2026 sur l'historique des exécutions : GitHub
    # n'honore ce cron que cinq à six fois par jour (00:15, 04:48, 09:46, 13:57, 17:50,
    # 20:56), soit un passage toutes les 3 à 5 h, tous réussis. Les crons fréquents sont
    # retardés ou sautés en période de charge ; ce n'est pas un échec du script. Pour
    # tenir vraiment deux passages par heure, il faudrait un déclencheur externe qui
    # appelle `workflow_dispatch` avec un jeton. En attendant, le navigateur relit les
    # sources lui-même et Logs → Cet appareil montre l'âge du fichier.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-streams
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Chromium (~150 Mo) était retéléchargé à chaque passage : gardé d'une fois sur
      # l'autre, clé sur le lockfile, qui fixe la version de Playwright.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Prefetch stream links from all sources
        # Marge de securite au-dela des bornes posees dans le script lui-meme :
        # le passage du 5 septembre est mort a 4 Go, le defaut de Node sur ce runner.
        run: node --max-old-space-size=8192 scripts/scrape_streams.mjs

      # Verification observee des lecteurs (scripts/verify_players.mjs) : un vrai
      # Chromium charge les lecteurs des matchs en direct et note ce qui joue. Le
      # navigateur est installe ici, pas dans le script : un echec ici ne bloque pas
      # le commit du cache deja produit par l'etape precedente.
      - name: Install Chromium for player verification
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Verify which players actually play
        run: node scripts/verify_players.mjs
        continue-on-error: true

      # Le passage de 14 h 10 (6 septembre 2026) a produit un cache frais et n'a pas pu le
      # pousser : main avait bougé pendant les huit minutes du scrape (fusions de PR,
      # commit de la grille), et l'action de commit ne rebase pas -> « non-fast-forward »,
      # cache perdu, et l'application est restée deux heures sur des liens périmés. On
      # met de côté le fichier produit, on se replace sur main, on le remet : en cas de
      # conflit sur le fichier lui-même, la version produite à l'instant l'emporte.
      - name: Rebase on latest main before committing
        run: |
          git stash push --include-untracked -- data/streams.json domains.json || true
          git pull --rebase origin main
          git stash pop || { git checkout --theirs -- data/streams.json domains.json; git add data/streams.json domains.json; git stash drop; }

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update hourly stream links cache"
          # domains.json est réécrit par le script quand un domaine meurt et qu'un
          # miroir prend le relais : sans le commiter, l'apprentissage serait perdu à
          # chaque exécution et le navigateur de l'utilisateur repartirait sur l'adresse
          # morte, qu'il lit dans ce fichier au démarrage.
          file_pattern: "data/streams.json domains.json"
