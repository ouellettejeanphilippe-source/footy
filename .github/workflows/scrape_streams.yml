name: Hourly stream links prefetch

on:
  schedule:
    # Deux fois par heure (6 septembre 2026) : les sites publient leurs liens dans l'heure
    # qui précède le coup d'envoi, et un cache horaire les manquait pour la moitié des
    # matchs. Les liens sont PUBLIÉS au bout de ~5 min (la lecture des sources), la
    # vérification des lecteurs continuant ensuite pour ~5 min de plus et donnant un
    # second commit ; décalé de :00 pour éviter la congestion des runners.
    #
    # Cadence RÉELLE, relevée le 9 septembre 2026 sur l'historique des exécutions : GitHub
    # n'honore ce cron que cinq à six fois par jour (00:15, 04:48, 09:46, 13:57, 17:50,
    # 20:56), soit un passage toutes les 3 à 5 h, tous réussis. Les crons fréquents sont
    # retardés ou sautés en période de charge ; ce n'est pas un échec du script. Le cron
    # reste comme AMORCE et filet de sécurité : c'est le relais (job `relais`, plus bas)
    # qui tient la cadence, en relançant ce workflow lui-même toutes les 30 min.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Un seul passage à la fois. Sans annulation (10 septembre 2026) : un cron qui tombait
# pendant un scrape annulait ce scrape et perdait son cache ; il attend maintenant son
# tour, et GitHub ne garde qu'un passage en attente, ce qui absorbe les doublons.
concurrency:
  group: scrape-streams
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Chromium (~150 Mo) était retéléchargé à chaque passage : gardé d'une fois sur
      # l'autre, clé sur le lockfile, qui fixe la version de Playwright.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Le calendrier du jour, si la passe quotidienne (scrape_schedule.yml, 09:00 UTC) n'a
      # pas encore tourné : son cron subit les mêmes retards que celui-ci (le 10 septembre
      # 2026, toujours rien à 12:30 UTC, et le 9, quatre heures de retard). Entre minuit et
      # cette passe, liens et calendrier n'étaient jamais datés du même jour. Ce workflow,
      # lui, repasse toutes les 30 min grâce au relais : il rattrape.
      - name: Regenerate the schedule cache if it is not today's
        run: |
          jour=$(TZ=America/New_York date +%Y%m%d)
          if grep -q "\"fetchDate\": \"$jour\"" data/schedule.json 2>/dev/null; then
            echo "data/schedule.json est déjà du $jour"
          else
            echo "data/schedule.json n'est pas du $jour : on le régénère"
            node scripts/scrape_schedule.mjs
          fi

      - name: Prefetch stream links from all sources
        # Marge de securite au-dela des bornes posees dans le script lui-meme :
        # le passage du 5 septembre est mort a 4 Go, le defaut de Node sur ce runner.
        run: node --max-old-space-size=8192 scripts/scrape_streams.mjs

      # ══ PUBLIER D'ABORD, VÉRIFIER ENSUITE ═══════════════════════════════════════
      # « C'est vraiment long » (12 septembre 2026). Mesuré sur le passage de 19:35 :
      # la lecture des onze sources dure 4 min 28 s, et le cache était pourtant commité
      # à 19:44:56 — dix minutes après le début — parce que la vérification des lecteurs
      # (un vrai Chromium qui charge les flux en direct, 5 min 13 s ce jour-là) passait
      # AVANT le commit. Les liens frais attendaient donc derrière une étape qui ne fait
      # que les annoter, et un runner perdu ou une vérification qui traîne les emportait
      # avec elle.
      #
      # On publie donc en deux temps : le cache dès qu'il existe, l'annotation ensuite.
      # L'application voit les liens deux fois plus vite, et la vérification devient ce
      # qu'elle est — un bonus, pas un péage.
      - name: Rebase on latest main before committing
        run: |
          git stash push --include-untracked -- data/streams.json data/schedule.json domains.json || true
          git pull --rebase origin main
          git stash pop || { git checkout --theirs -- data/streams.json data/schedule.json domains.json; git add data/streams.json data/schedule.json domains.json; git stash drop; }

      # Le passage de 14 h 10 (6 septembre 2026) a produit un cache frais et n'a pas pu le
      # pousser : main avait bougé pendant les huit minutes du scrape (fusions de PR,
      # commit de la grille), et l'action de commit ne rebase pas -> « non-fast-forward »,
      # cache perdu, et l'application est restée deux heures sur des liens périmés. D'où
      # l'étape ci-dessus : on met de côté le fichier produit, on se replace sur main, on
      # le remet ; en cas de conflit sur le fichier lui-même, la version produite à
      # l'instant l'emporte.
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update hourly stream links cache"
          # domains.json est réécrit par le script quand un domaine meurt et qu'un
          # miroir prend le relais : sans le commiter, l'apprentissage serait perdu à
          # chaque exécution et le navigateur de l'utilisateur repartirait sur l'adresse
          # morte, qu'il lit dans ce fichier au démarrage. data/schedule.json n'y figure
          # que les fois où l'étape « Regenerate the schedule cache » l'a produit.
          file_pattern: "data/streams.json data/schedule.json domains.json"

      # Verification observee des lecteurs (scripts/verify_players.mjs) : un vrai
      # Chromium charge les lecteurs des matchs en direct et note ce qui joue
      # (`verified` par lien, `hostPlay` par hote, `verifiedAt`). Le navigateur est
      # installe ici, pas dans le script : un echec ici ne bloque rien, le cache est
      # deja publie par l'etape precedente.
      - name: Install Chromium for player verification
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Verify which players actually play
        run: node scripts/verify_players.mjs
        continue-on-error: true

      # Second temps : l'annotation. `main` a pu bouger pendant la verification (un autre
      # passage, une fusion de PR), donc on se replace avant de commiter. Sans changement
      # — verification sautee ou sans nouvelle observation — l'action ne commite rien.
      - name: Rebase again before committing the verification
        run: |
          git stash push --include-untracked -- data/streams.json || true
          git pull --rebase origin main
          git stash pop || { git checkout --theirs -- data/streams.json; git add data/streams.json; git stash drop; }

      - name: Commit the player verification
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: note which players actually play"
          file_pattern: "data/streams.json"

  # ══ RELAIS : deux passages par heure, malgré le cron ═══════════════════════════
  # GitHub retarde ou saute les crons fréquents (cinq à six exécutions par jour au lieu
  # de 48, relevé le 9 septembre 2026). Un déclencheur externe demanderait un jeton et
  # un service de plus. Le dépôt peut le faire seul : le GITHUB_TOKEN a le droit de
  # lancer un `workflow_dispatch`, et c'est l'une des deux exceptions à la règle « un
  # workflow ne déclenche pas de workflow ». Ce job attend donc le créneau suivant
  # (30 min après le début du passage), vérifie qu'aucun autre passage n'est déjà en
  # route ou en attente (le cron en amorce un de temps en temps : il reprend alors le
  # relais), et relance le workflow. Il tourne même si le scrape a échoué (`always()`),
  # sinon un seul échec casserait la chaîne ; si le runner est perdu, le cron suivant la
  # rétablit dans les cinq heures. Le dépôt est public : les minutes du runner en attente
  # ne coûtent rien. Pour arrêter le relais sans commit : Settings → Secrets and
  # variables → Actions → variable SCRAPE_RELAIS = off.
  relais:
    needs: scrape
    if: always() && vars.SCRAPE_RELAIS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
    steps:
      - name: Attendre le prochain créneau, puis relancer le workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INTERVALLE_S: '1800'
        run: |
          # Créneau compté depuis le DÉBUT du scrape (pas depuis la demande : un passage
          # amorcé par le cron peut avoir attendu son tour dans la file).
          debut=$(gh run view "$GITHUB_RUN_ID" --json jobs -q '[.jobs[] | select(.name == "scrape") | .startedAt][0] // empty')
          [ -n "$debut" ] || debut=$(gh run view "$GITHUB_RUN_ID" --json createdAt -q .createdAt)
          cible=$(( $(date -u -d "$debut" +%s) + INTERVALLE_S ))
          attente=$(( cible - $(date -u +%s) ))
          echo "Passage commencé à $debut ; prochain créneau dans ${attente}s"
          if [ "$attente" -gt 0 ]; then sleep "$attente"; fi
          autres=$(gh run list --workflow scrape_streams.yml --limit 20 --json databaseId,status \
            -q "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\" or .status == \"requested\" or .status == \"pending\")] | length")
          if [ "${autres:-0}" -gt 0 ]; then
            echo "Un autre passage est déjà en route ou en attente ($autres) : il reprend le relais."
            exit 0
          fi
          gh workflow run scrape_streams.yml --ref main
          echo "Passage suivant demandé."
