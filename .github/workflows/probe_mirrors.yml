name: Probe candidate mirrors (diagnostic)

on:
  push:
    branches: [ "claude/match-links-access-5gmco2" ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Direct fetch of candidate mirror domains
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          for u in https://sportsurge.ws/ https://sportsurge.baby/ https://sportsurge.lol/ https://v2.sportsurge.net/ https://sportsurge.io/ https://v2.gostreameast.is/ https://thestreameast.fun/ https://streameast.is/ https://streameast.ph/ https://streameast.sg/ https://streameast.ch/ https://streameast.fm/ https://footybite.to/ https://footybite.do/ https://footybite.ltd/ https://footybites.life/ https://vipleague.io/ https://vipleague.pm/ https://vipleague.wtf/ https://vipleaguetv.fit/ https://vipleague.cc/ https://methstreams.com/ https://methstreams.net/ https://buffstreams.app/ https://totalsportek.to/ https://onhockey.tv/; do
            echo "=== DIRECT $u"
            curl -sS -L -m 20 -A "$UA" -o /tmp/body.html -w "status=%{http_code} final=%{url_effective} bytes=%{size_download}\n" "$u" || echo "curl failed"
            grep -o -i -m1 "<title>[^<]*</title>" /tmp/body.html || true
            echo "anchors=$(grep -o -i '<a ' /tmp/body.html | wc -l) nextjs=$(grep -c '__next_f' /tmp/body.html || true) cf=$(grep -c -i 'just a moment\|challenge-platform' /tmp/body.html || true)"
          done
      - name: Same mirrors through corsproxy.io / codetabs / allorigins
        run: |
          ORIGIN="https://ouellettejeanphilippe-source.github.io"
          probe() {
            local label="$1" url="$2"
            echo "--- $label"
            curl -sS -m 20 -H "Origin: $ORIGIN" -H "Accept: text/html,*/*" -o /tmp/p.html -w "status=%{http_code} bytes=%{size_download}\n" "$url" || echo "curl failed"
            head -c 160 /tmp/p.html | tr '\n' ' '; echo
            echo "anchors=$(grep -o -i '<a ' /tmp/p.html | wc -l) nextjs=$(grep -c '__next_f' /tmp/p.html || true)"
          }
          for t in https://sportsurge.ws/ https://v2.gostreameast.is/ https://thestreameast.fun/ https://footybite.to/ https://vipleague.io/ https://onhockey.tv/; do
            echo "=== TARGET $t"
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$t")
            probe "corsproxy.io" "https://corsproxy.io/?$enc"
            probe "codetabs" "https://api.codetabs.com/v1/proxy?quest=$t"
            probe "allorigins raw" "https://api.allorigins.win/raw?url=$enc"
            probe "corsfix" "https://proxy.corsfix.com/?$t"
          done
