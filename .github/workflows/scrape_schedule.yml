name: Daily ESPN Schedule Scraper

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC = 4:00 AM EST / 5:00 AM EDT
  workflow_dispatch:
  # Relancé sur un push SEULEMENT quand ce qui produit le calendrier change. Jusqu'au
  # 9 septembre 2026, chaque fusion de PR (même une ligne de documentation) relançait
  # un scrape ESPN complet et recommitait data/schedule.json : c'est ce qui créait la
  # course avec le workflow des liens décrite plus bas.
  push:
    branches:
      - main
    paths:
      - 'scripts/scrape_schedule.mjs'
      - 'js/nuit.js'
      - 'js/db.js'
      - 'js/teams.js'
      - '.github/workflows/scrape_schedule.yml'

permissions:
  contents: write

# Deux passages en même temps se rebaseraient l'un sur l'autre : on ne garde que le
# dernier demandé, l'autre attend son tour (rien n'est annulé : un passage commencé
# a déjà interrogé ESPN, autant le laisser écrire).
concurrency:
  group: scrape-schedule
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        run: node scripts/scrape_schedule.mjs

      # Le passage de 14 h 10 (6 septembre 2026) a produit un cache frais et n'a pas pu le
      # pousser : main avait bougé pendant les huit minutes du scrape (fusions de PR,
      # commit de la grille), et l'action de commit ne rebase pas -> « non-fast-forward »,
      # cache perdu, et l'application est restée deux heures sur des liens périmés. On
      # met de côté le fichier produit, on se replace sur main, on le remet : en cas de
      # conflit sur le fichier lui-même, la version produite à l'instant l'emporte.
      - name: Rebase on latest main before committing
        run: |
          git stash push --include-untracked -- data/schedule.json || true
          git pull --rebase origin main
          git stash pop || { git checkout --theirs -- data/schedule.json; git add data/schedule.json; git stash drop; }

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily ESPN schedule cache"
          file_pattern: "data/schedule.json"
