name: Daily ESPN Schedule Scraper

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC = 4:00 AM EST / 5:00 AM EDT
  workflow_dispatch:
  # Relancé sur un push SEULEMENT quand ce qui produit le calendrier change. Jusqu'au
  # 9 septembre 2026, chaque fusion de PR (même une ligne de documentation) relançait
  # un scrape ESPN complet et recommitait data/schedule.json : c'est ce qui créait la
  # course avec le workflow des liens décrite plus bas.
  push:
    branches:
      - main
    paths:
      - 'scripts/scrape_schedule.mjs'
      - 'js/nuit.js'
      - 'js/db.js'
      - 'js/teams.js'
      - '.github/workflows/scrape_schedule.yml'

permissions:
  contents: write

# Deux passages en même temps se rebaseraient l'un sur l'autre : on ne garde que le
# dernier demandé, l'autre attend son tour (rien n'est annulé : un passage commencé
# a déjà interrogé ESPN, autant le laisser écrire).
concurrency:
  group: scrape-schedule
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        run: node scripts/scrape_schedule.mjs

      # Le passage de 14 h 10 (6 septembre 2026) a produit un cache frais et n'a pas pu le
      # pousser : main avait bougé pendant les huit minutes du scrape (fusions de PR,
      # commit de la grille), et l'action de commit ne rebase pas -> « non-fast-forward »,
      # cache perdu, et l'application est restée deux heures sur des liens périmés. On
      # met de côté le fichier produit, on se replace sur main, on le remet : en cas de
      # conflit sur le fichier lui-même, la version produite à l'instant l'emporte.
      - name: Rebase on latest main before committing
        run: |
          git stash push --include-untracked -- data/schedule.json || true
          git pull --rebase origin main
          git stash pop || { git checkout --theirs -- data/schedule.json; git add data/schedule.json; git stash drop; }

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily ESPN schedule cache"
          file_pattern: "data/schedule.json"

  # ══ VEILLE : relancer la chaîne des liens si elle s'est arrêtée ═════════════════
  # « Je veux pas faire rien d'externe » ; « je veux pas le faire manuellement » (28
  # octobre 2026). La chaîne des 30 minutes des liens s'est déjà arrêtée sans prévenir
  # (cron mort du 20 septembre au 9 octobre 2026, relance en HTTP 500 le 6 octobre :
  # liens figés deux jours et demi), et seul un clic dans Actions la rétablissait. Ce job
  # lit l'âge de data/streams.json (scripts/age_liens.mjs) : au-delà du seuil, et si
  # aucun passage des liens n'est déjà en route ou en attente, il relance
  # scrape_streams.yml lui-même (`gh workflow run`, ce que le GITHUB_TOKEN a le droit de
  # faire), et le relais reprend de là. C'est un second cron, indépendant de celui des
  # liens, qui sert de filet : au rythme du calendrier, donc une panne dure des heures,
  # pas des jours, et personne n'a rien à faire. Il tourne après le calendrier, même si
  # celui-ci a échoué (`always()`), ne fait jamais échouer le passage, et respecte
  # l'arrêt volontaire du relais (variable de dépôt SCRAPE_RELAIS = off).
  veille:
    needs: scrape
    if: always() && vars.SCRAPE_RELAIS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restart the links workflow if the cache is stale
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          etat=$(node scripts/age_liens.mjs data/streams.json)
          echo "$etat"
          perime=$(node -e "console.log(JSON.parse(process.argv[1]).perime)" "$etat")
          if [ "$perime" != "true" ]; then
            echo "Liens frais : rien à faire."
            exit 0
          fi
          en_route=$(gh run list --workflow scrape_streams.yml --limit 20 --json status \
            -q '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "requested" or .status == "pending")] | length' \
            2>/dev/null || echo 0)
          if [ "${en_route:-0}" -gt 0 ]; then
            echo "Liens périmés, mais un passage est déjà en route ou en attente ($en_route) : il s'en charge."
            exit 0
          fi
          if gh workflow run scrape_streams.yml --ref main; then
            echo "Liens périmés : chaîne relancée."
          else
            echo "::warning::Liens périmés et relance impossible (voir le journal ci-dessus)."
          fi
