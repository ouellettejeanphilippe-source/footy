# Surveillance des domaines des sources de flux.
#
# Les sites agrégateurs changent de domaine sans prévenir : c'est la panne la plus
# fréquente de l'application. La vérification vivait dans `npm test`, sur chaque
# « pull request », où elle rendait rouges des changements de code sans rapport —
# Cloudflare répond 403/429/520 selon l'adresse IP du runner, pas selon le diff.
# Elle a donc sa propre exécution, quotidienne, qui n'empêche personne de livrer.
name: Surveillance des domaines

on:
  schedule:
    - cron: '0 5 * * *'   # tous les jours à 05:00 UTC
  workflow_dispatch:

jobs:
  domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Vérifier les domaines déclarés dans js/config.js
        run: npm run test:domains
