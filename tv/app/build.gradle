plugins {
    id 'com.android.application'
}

android {
    namespace = 'ca.local.footytv'
    compileSdk = 35

    defaultConfig {
        // Un identifiant distinct de l'appli téléphone (ca.local.footy) : les deux
        // peuvent coexister, et l'une ne remplace jamais l'autre.
        applicationId 'ca.local.footytv'
        minSdk 26          // Chromecast avec Google TV : Android 10 au minimum
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // R8 retire ce qu'ExoPlayer embarque et qu'on n'utilise pas (DASH, SmoothStreaming,
            // RTSP, sous-titres…) : l'APK passe d'environ 4 Mo à moins de 2.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signé avec la clé de débogage de la machine qui fabrique : de quoi installer
            // l'APK à la main. Une mise à jour fabriquée ailleurs (autre clé) demande de
            // désinstaller d'abord (README.md).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    def media3 = '1.8.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"

    testImplementation 'junit:junit:4.13.2'
    // android.jar ne fournit que des souches d'org.json : les tests JVM ont besoin du vrai.
    testImplementation 'org.json:json:20240303'
}
