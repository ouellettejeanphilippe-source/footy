<!doctype html>
<!-- L'APK sert le site en ligne (capacitor.config.json, server.url). Sans réseau au
     démarrage, Capacitor affiche cette page, embarquée dans l'APK (server.errorPath) :
     elle le dit, et réessaie d'elle-même dès que le réseau revient. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide des Sports</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font: 600 20px/1.4 system-ui, sans-serif; text-align: center; }
  p { margin: 0 0 24px; opacity: 0.85; }
  button { font: inherit; color: #000; background: #fff; border: 0; border-radius: 999px; padding: 14px 32px; cursor: pointer; }
  button:focus { outline: 4px solid #4caf50; outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <h1>Pas de connexion</h1>
  <p>Le Guide des Sports se charge en ligne. Il réessaie dès que le réseau revient.</p>
  <button id="reessayer" autofocus>Réessayer</button>
</main>
<script>
  var SITE = 'https://ouellettejeanphilippe-source.github.io/footy/';
  function reessayer() { location.replace(SITE); }
  document.getElementById('reessayer').addEventListener('click', reessayer);
  window.addEventListener('online', reessayer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter') reessayer(); });
  setInterval(function () { if (navigator.onLine) reessayer(); }, 15000);
</script>
</body>
</html>
